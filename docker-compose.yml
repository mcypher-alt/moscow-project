services:
  # 1. База данных
  postgres:
    image: postgres:16-alpine
    container_name: hackathon_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    container_name: moscow_valkey
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", ""]

  # 2. ML-микросервис
  ml-service:
    build: ./ml-service
    container_name: hackathon_ml
    restart: unless-stopped
    environment:
      ML_BATCH_FEATURES: ${ML_BATCH_FEATURES:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service:/app
      - ${MODEL_DIR:-./models/refined_24h}:/models:ro

  # 3. Основной бэкенд (Express)
  server:
    build: ./server
    container_name: hackathon_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://dev:password@postgres:5432/main_db?schema=public"
      ML_SERVICE_URL: "http://ml-service:8000/predict"
      REDIS_URL: "redis://valkey:6379"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LDAP_URL: ${LDAP_URL:-}
      DISABLE_WORKER: ${DISABLE_WORKER:-false}
    depends_on:
      - postgres
      - ml-service
      - valkey
    volumes:
      - ./server:/app
      - /app/node_modules

  # 4. Фронтенд (React)
  client:
    build: ./client
    container_name: hackathon_client
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:5000
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
